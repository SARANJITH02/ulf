title: IRC or Botnet Protocol Tunneling
id: SIGMA-T1071-IRC-002
status: production
description: Detects outbound communication to standard IRC botnet ports.
level: high
tags:
  - attack.t1071
  - attack.command_and_control
logsource:
  category: network_traffic
detection:
  selection:
    destination.port:
      - 6667
      - 6697
    network.protocol:
      - TCP
  condition: selection
