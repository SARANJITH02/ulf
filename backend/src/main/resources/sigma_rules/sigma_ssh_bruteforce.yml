title: SSH Brute Force Authentication Failure
id: SIGMA-T1110-SSH-001
status: production
description: Detects repeated or blocked SSH authentication attempts indicating possible credential brute forcing.
level: high
tags:
  - attack.t1110
  - attack.credential_access
logsource:
  category: network_traffic
  product: firewall
detection:
  selection:
    destination.port: 22
    event.action:
      - blocked
      - denied
      - drop
      - failed
      - failure
  condition: selection
