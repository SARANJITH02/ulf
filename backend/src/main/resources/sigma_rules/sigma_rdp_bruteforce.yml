title: RDP Remote Desktop Brute Force Attempt
id: SIGMA-T1110-RDP-002
status: production
description: Detects blocked or failed RDP connection attempts on port 3389.
level: high
tags:
  - attack.t1110
  - attack.credential_access
logsource:
  category: network_traffic
  product: firewall
detection:
  selection:
    destination.port: 3389
    event.action:
      - blocked
      - denied
      - drop
      - failed
  condition: selection
