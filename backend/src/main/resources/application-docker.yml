spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ulpf_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:ulpf_user}
    password: ${DB_PASSWORD:ulpf_pass_secret}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

ulpf:
  syslog:
    udp-port: ${SYSLOG_UDP_PORT:514}
    tcp-port: ${SYSLOG_TCP_PORT:514}
