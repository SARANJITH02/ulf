server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ulpf-middleware
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:file:./data/db/ulpfdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

ulpf:
  airgapped: true
  syslog:
    udp-enabled: true
    udp-port: 1514
    tcp-enabled: true
    tcp-port: 1514
  security:
    jwt-secret: "uLpF-S3cur1ty-G4t3w4y-Pr0duct10n-K3y-S3cur3-2026-X99"
    jwt-expiration-ms: 86400000 # 24 hours
  metrics:
    broadcast-interval-ms: 1000
  ledger:
    file-path: "./data/ledger/merkle-ledger.jsonl"
    batch-cron: "0 0 * * * *" # Hourly batching by default
  rules:
    confidence-high-threshold: 0.90
    confidence-medium-threshold: 0.70
    dlq-max-retries: 3
    enrichment-rfc1918-enabled: true
    enrichment-mitre-enabled: true
    sigma-enabled: true
    require-operator-approval: true
  drift:
    check-interval-ms: 300000 # 5 minutes
    confidence-drop-threshold: 0.15 # 15 percentage points drop
    success-rate-threshold: 0.85 # 85% success rate baseline
  correlation:
    enabled: true
    window-minutes: 30
    check-interval-ms: 120000 # 2 minutes

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
